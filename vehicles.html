<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vehicles - Motor Industry App</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="splash-screen"><div class="splash-icon"><i class="bi bi-speedometer2"></i></div><div class="splash-title">Motor Industry</div><div class="splash-loader"></div></div>
  <div id="app-shell" style="display:block">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><i class="bi bi-speedometer2"></i><span>Motor Industry</span></div>
      <nav class="mt-3">
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="vehicles.html" class="nav-link active" data-page="vehicles"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="customers.html" class="nav-link" data-page="customers"><i class="bi bi-people"></i> Customers</a>
        <a href="services.html" class="nav-link" data-page="services"><i class="bi bi-wrench-adjustable"></i> Services</a>
        <a href="parts.html" class="nav-link" data-page="parts"><i class="bi bi-box-seam"></i> Parts</a>
        <a href="diagnostics.html" class="nav-link" data-page="diagnostics"><i class="bi bi-clipboard2-pulse"></i> Diagnostics</a>
        <a href="settings.html" class="nav-link" data-page="settings"><i class="bi bi-gear"></i> Settings</a>
      </nav>
      <div class="position-absolute bottom-0 start-0 end-0 p-3">
        <div class="text-white-50 small mb-2" id="current-user">User</div>
        <button class="btn btn-outline-light btn-sm w-100" id="btn-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <div class="d-flex align-items-center gap-3 flex-grow-1">
          <button class="btn btn-outline-secondary d-lg-none btn-sm" id="menu-toggle"><i class="bi bi-list"></i></button>
          <h5 class="mb-0">Vehicles</h5>
          <div class="ms-2" style="max-width:220px;width:100%">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control border-start-0" id="global-search" placeholder="Search..." autocomplete="off">
            </div>
          </div>
        </div>
        <div class="text-muted small d-none d-md-block" id="current-date"></div>
      </div>
      <div class="content-card">
        <div class="card-header"><span>Vehicle Inventory</span><button class="btn btn-primary btn-sm" id="btn-add-vehicle"><i class="bi bi-plus-lg"></i> Add</button></div>
        <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Vehicle</th><th>Year</th><th>Color</th><th>Mileage</th><th>Price</th><th>Status</th><th>VIN</th><th></th></tr></thead><tbody id="vehicles-table-body"></tbody></table></div></div>
      </div>
    </main>
    <nav class="bottom-nav">
      <a href="dashboard.html" class="bottom-nav-item" data-page="dashboard"><i class="bi bi-grid-1x2"></i><span>Home</span></a>
      <a href="vehicles.html" class="bottom-nav-item active" data-page="vehicles"><i class="bi bi-car-front"></i><span>Vehicles</span></a>
      <a href="diagnostics.html" class="bottom-nav-item" data-page="diagnostics"><i class="bi bi-clipboard2-pulse"></i><span>Diagnose</span></a>
      <a href="services.html" class="bottom-nav-item" data-page="services"><i class="bi bi-wrench-adjustable"></i><span>Services</span></a>
      <a href="settings.html" class="bottom-nav-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
    </nav>
  </div>

  <div class="modal fade" id="vehicleModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="vehicle-form"><div class="modal-header"><h5 class="modal-title" id="vehicleModalLabel">Add Vehicle</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Make *</label><input type="text" class="form-control" id="v-make" required></div><div class="col-md-6"><label class="form-label">Model *</label><input type="text" class="form-control" id="v-model" required></div><div class="col-md-4"><label class="form-label">Year *</label><input type="number" class="form-control" id="v-year" required min="1990" max="2030"></div><div class="col-md-4"><label class="form-label">Price (ZAR) *</label><input type="number" class="form-control" id="v-price" required min="0"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" id="v-status"><option>In Stock</option><option>Reserved</option><option>Sold</option></select></div><div class="col-md-4"><label class="form-label">Mileage</label><input type="number" class="form-control" id="v-mileage" min="0"></div><div class="col-md-4"><label class="form-label">Colour</label><input type="text" class="form-control" id="v-color"></div><div class="col-md-4"><label class="form-label">Fuel</label><select class="form-select" id="v-fuel"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Electric</option></select></div><div class="col-12"><label class="form-label">VIN</label><input type="text" class="form-control" id="v-vin"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initShell } from './js/shell.js';
    import { renderVehicles, openVehicleModal, saveVehicle } from './js/vehicles.js';
    if (initShell('vehicles')) {
      renderVehicles();
      document.getElementById('btn-add-vehicle')?.addEventListener('click', () => openVehicleModal());
      document.getElementById('vehicle-form')?.addEventListener('submit', saveVehicle);
      document.getElementById('global-search')?.addEventListener('input', (e) => renderVehicles(e.target.value));
    }
  </script>
</body>
</html>
