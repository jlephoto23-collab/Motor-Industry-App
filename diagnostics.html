<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diagnostics - Motor Industry App</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="splash-screen"><div class="splash-icon"><i class="bi bi-speedometer2"></i></div><div class="splash-title">Motor Industry</div><div class="splash-loader"></div></div>
  <div id="loading-overlay"><div class="loading-spinner"></div><div class="loading-text" id="loading-text">Analysing vehicle...</div></div>
  <div id="app-shell" style="display:block">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><i class="bi bi-speedometer2"></i><span>Motor Industry</span></div>
      <nav class="mt-3">
        <a href="dashboard.html" class="nav-link" data-page="dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="vehicles.html" class="nav-link" data-page="vehicles"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="customers.html" class="nav-link" data-page="customers"><i class="bi bi-people"></i> Customers</a>
        <a href="services.html" class="nav-link" data-page="services"><i class="bi bi-wrench-adjustable"></i> Services</a>
        <a href="parts.html" class="nav-link" data-page="parts"><i class="bi bi-box-seam"></i> Parts</a>
        <a href="diagnostics.html" class="nav-link active" data-page="diagnostics"><i class="bi bi-clipboard2-pulse"></i> Diagnostics</a>
        <a href="settings.html" class="nav-link" data-page="settings"><i class="bi bi-gear"></i> Settings</a>
      </nav>
      <div class="position-absolute bottom-0 start-0 end-0 p-3">
        <div class="text-white-50 small mb-2" id="current-user">User</div>
        <button class="btn btn-outline-light btn-sm w-100" id="btn-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <div class="d-flex align-items-center gap-3 flex-grow-1">
          <button class="btn btn-outline-secondary d-lg-none btn-sm" id="menu-toggle"><i class="bi bi-list"></i></button>
          <h5 class="mb-0">Diagnostics</h5>
        </div>
        <div class="text-muted small d-none d-md-block" id="current-date"></div>
      </div>

      <div class="content-card mb-3">
        <div class="card-header"><span><i class="bi bi-clipboard2-pulse"></i> Diagnostics & Restoration</span></div>
        <div class="card-body">
          <p class="text-muted small mb-3">Enter any vehicle details to get advice on what needs to be done.</p>
          <div class="row g-3">
            <div class="col-6 col-md-3"><label class="form-label">Make *</label><input type="text" class="form-control" id="diag-make" placeholder="BMW"></div>
            <div class="col-6 col-md-3"><label class="form-label">Model *</label><input type="text" class="form-control" id="diag-model" placeholder="325is"></div>
            <div class="col-6 col-md-2"><label class="form-label">Year *</label><input type="number" class="form-control" id="diag-year" min="1960" max="2030" placeholder="1992"></div>
            <div class="col-6 col-md-2"><label class="form-label">Mileage</label><input type="number" class="form-control" id="diag-mileage" min="0" placeholder="220000"></div>
            <div class="col-12 col-md-2"><label class="form-label">Condition</label><select class="form-select" id="diag-condition"><option value="Good">Good</option><option value="Fair" selected>Fair</option><option value="Poor">Poor</option></select></div>
          </div>
          <div class="mt-3" id="diag-symptoms">
            <label class="form-label fw-semibold">Symptoms</label>
            <div class="row g-2">
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="engine-noise" id="sym-1"><label class="form-check-label" for="sym-1">Engine noise</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="smoke" id="sym-2"><label class="form-check-label" for="sym-2">Smoke</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="overheating" id="sym-3"><label class="form-check-label" for="sym-3">Overheating</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="vibration" id="sym-4"><label class="form-check-label" for="sym-4">Vibration</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="brake-issues" id="sym-5"><label class="form-check-label" for="sym-5">Brakes</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="electrical" id="sym-6"><label class="form-check-label" for="sym-6">Electrical</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="ac-not-cold" id="sym-7"><label class="form-check-label" for="sym-7">A/C</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="rust" id="sym-8"><label class="form-check-label" for="sym-8">Rust</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="oil-leak" id="sym-9"><label class="form-check-label" for="sym-9">Oil leak</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="rough-idle" id="sym-10"><label class="form-check-label" for="sym-10">Rough idle</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="hard-start" id="sym-11"><label class="form-check-label" for="sym-11">Hard start</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="warning-light" id="sym-12"><label class="form-check-label" for="sym-12">Warning light</label></div></div>
            </div>
          </div>
          <div class="mt-3"><button class="btn btn-primary w-100" id="btn-run-diagnosis"><i class="bi bi-search"></i> Run Diagnosis</button></div>
        </div>
      </div>
      <div id="diag-results" class="content-card d-none">
        <div class="card-header text-white" style="background:#2563eb"><i class="bi bi-clipboard2-check"></i> Results & Restoration Plan</div>
        <div class="card-body" id="diag-results-content"></div>
      </div>
    </main>
    <nav class="bottom-nav">
      <a href="dashboard.html" class="bottom-nav-item" data-page="dashboard"><i class="bi bi-grid-1x2"></i><span>Home</span></a>
      <a href="vehicles.html" class="bottom-nav-item" data-page="vehicles"><i class="bi bi-car-front"></i><span>Vehicles</span></a>
      <a href="diagnostics.html" class="bottom-nav-item active" data-page="diagnostics"><i class="bi bi-clipboard2-pulse"></i><span>Diagnose</span></a>
      <a href="services.html" class="bottom-nav-item" data-page="services"><i class="bi bi-wrench-adjustable"></i><span>Services</span></a>
      <a href="settings.html" class="bottom-nav-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initShell } from './js/shell.js';
    import { renderDiagnostics, initDiagnostics } from './js/diagnostics.js';
    if (initShell('diagnostics')) {
      initDiagnostics();
      renderDiagnostics();
    }
  </script>
</body>
</html>
