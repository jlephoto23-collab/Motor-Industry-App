<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Motor Industry App - Login</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Dealer Management System for the Motor Industry">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MotorApp">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="splash-screen">
    <div class="splash-icon"><i class="bi bi-speedometer2"></i></div>
    <div class="splash-title">Motor Industry</div>
    <div class="splash-subtitle">Dealer Management System</div>
    <div class="splash-loader"></div>
  </div>

  <div id="login-screen" style="display:flex">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon"><i class="bi bi-speedometer2"></i></div>
        <h1>Motor Industry</h1>
        <p>Dealer Management System</p>
      </div>
      <div class="login-body">
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" class="form-control form-control-lg" id="login-username" required autofocus placeholder="Enter username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" class="form-control form-control-lg" id="login-password" required placeholder="Enter password">
          </div>
          <div id="login-error" class="alert alert-danger d-none py-2" role="alert"></div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
        </form>
        <div class="login-demo">
          <strong>Demo Accounts</strong>
          admin / admin123<br>
          sales / sales123 &nbsp;•&nbsp; tech / tech123
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { isAuthenticated, login } from './js/data.js';

    // Already logged in → open dashboard page
    if (isAuthenticated()) {
      window.location.replace('dashboard.html');
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash-screen')?.classList.add('hide');
      }, 1200);
    });

    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');

      const result = login(username, password);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.remove('d-none');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
